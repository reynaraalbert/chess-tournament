<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Chess Tour - Login and Registration">
    <title>Chess Tour - Authentication</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            overflow: hidden;
            position: relative;
        }

        .container {
            width: 100%;
            max-width: 420px;
            position: relative;
            padding: 20px;
        }

        .card {
            perspective: 1500px;
            width: 100%;
        }

        .card-inner {
            width: 100%;
            height: 460px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.4, 0.2, 0.2, 1);
        }

        .card.flip .card-inner {
            transform: rotateY(180deg);
        }

        .form-box {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            padding: 40px;
            backface-visibility: hidden;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5), inset 0 0 10px rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .register-box {
            transform: rotateY(180deg);
        }

        h2 {
            text-align: center;
            margin-bottom: 35px;
            font-weight: 600;
            font-size: 28px;
            letter-spacing: 0.5px;
            background: linear-gradient(to right, #fff, #a0aec0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            color: transparent;
        }

        .input-group {
            position: relative;
            margin-bottom: 25px;
        }

        .input-group input {
            width: 100%;
            padding: 16px 20px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            outline: none;
            color: #fff;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: #00d2ff;
            background: rgba(0, 0, 0, 0.4);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.2);
        }

        .input-group label {
            position: absolute;
            top: 50%;
            left: 20px;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.5);
            pointer-events: none;
            transition: 0.3s ease;
            font-size: 15px;
        }

        /* Float label on focus or when not empty */
        .input-group input:focus ~ label,
        .input-group input:not(:placeholder-shown) ~ label {
            top: 0;
            transform: translateY(-50%);
            left: 15px;
            font-size: 12px;
            color: #00d2ff;
            background: #1b2e36; /* Blends with the glassmorphism */
            padding: 0 8px;
            border-radius: 4px;
            letter-spacing: 0.5px;
        }

        .btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(45deg, #00d2ff, #3a7bd5);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            box-shadow: 0 5px 15px rgba(0, 210, 255, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 210, 255, 0.5);
            background: linear-gradient(45deg, #1ae2ff, #478eff);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .switch-form {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
        }

        .switch-form a {
            color: #00d2ff;
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
            margin-left: 5px;
        }

        .switch-form a:hover {
            text-decoration: underline;
            color: #fff;
        }

        .greeting {
            text-align: center;
            margin-bottom: 25px;
            font-size: 20px;
            letter-spacing: 0.4px;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 500;
        }

        .notification {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: #ff4757;
            color: #fff;
            padding: 14px 28px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 500;
            opacity: 0;
            visibility: hidden;
            transition: all 0.45s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            white-space: nowrap;
            box-shadow: 0 10px 25px rgba(255, 71, 87, 0.5);
            z-index: 9999;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .notification.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
            visibility: visible;
        }

        .notification.success {
            background: #2ed573;
            box-shadow: 0 10px 25px rgba(46, 213, 115, 0.5);
        }

        /* Decorative animated circles for background */
        .circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.5;
            animation: float 10s infinite ease-in-out;
        }

        .circle-1 {
            width: 350px;
            height: 350px;
            top: -100px;
            left: -100px;
            background: linear-gradient(45deg, #00d2ff, #3a7bd5);
        }

        .circle-2 {
            width: 300px;
            height: 300px;
            bottom: -50px;
            right: -80px;
            background: linear-gradient(45deg, #ff007a, #7a00ff);
            animation-delay: -5s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-20px) scale(1.05); }
        }

    </style>
</head>
<body>
    <!-- Toast Notification (fixed, always visible) -->
    <div id="notification" class="notification">Message</div>

    <div class="circle circle-1"></div>
    <div class="circle circle-2"></div>

    <div class="container">
        <div class="greeting" id="timeGreeting">Welcome back!</div>
        
        <div class="card" id="card">
            <div class="card-inner">
                <!-- Login Form -->
                <div class="form-box login-box">
                    <h2>Welcome Back</h2>
                    <form id="loginForm">
                        <div class="input-group">
                            <input type="text" id="loginUsername" placeholder=" " required autocomplete="off">
                            <label>Username</label>
                        </div>
                        <div class="input-group">
                            <input type="password" id="loginPassword" placeholder=" " required>
                            <label>Password</label>
                        </div>
                        <button type="submit" class="btn">Log In</button>
                        <div class="switch-form">
                            Don't have an account? <a href="#" onclick="toggleForm(event)">Register</a>
                        </div>
                    </form>
                </div>

                <!-- Register Form -->
                <div class="form-box register-box">
                    <h2>Create Account</h2>
                    <form id="registerForm">
                        <div class="input-group">
                            <input type="text" id="regUsername" placeholder=" " required autocomplete="off">
                            <label>New Username</label>
                        </div>
                        <div class="input-group">
                            <input type="password" id="regPassword" placeholder=" " required>
                            <label>New Password</label>
                        </div>
                        <button type="submit" class="btn">Register</button>
                        <div class="switch-form">
                            Already have an account? <a href="#" onclick="toggleForm(event)">Log In</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        const card = document.getElementById('card');
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const notification = document.getElementById('notification');
        const timeGreeting = document.getElementById('timeGreeting');
        
        let notifTimeout;

        function getTimeGreeting() {
            const hour = new Date().getHours();
            if (hour < 12) return 'Good morning';
            if (hour < 18) return 'Good afternoon';
            return 'Good evening';
        }

        function updateGreeting() {
            const currentUser = localStorage.getItem('currentUser');
            const name = currentUser || localStorage.getItem('lastUser') || 'Challenger';
            timeGreeting.textContent = `${getTimeGreeting()}, ${name}!`;
        }

        function saveLastUser(username) {
            if (!username) return;
            localStorage.setItem('lastUser', username);
        }

        // Toggle between Login and Register views
        function toggleForm(e) {
            if(e) e.preventDefault();
            card.classList.toggle('flip');
            
            // Allow time for the flip animation, then clear forms
            setTimeout(() => {
                loginForm.reset();
                registerForm.reset();
                hideNotification();
            }, 300);
        }

        // Show toast notifications
        function showNotification(message, isSuccess = false) {
            clearTimeout(notifTimeout);
            notification.textContent = message;
            
            if (isSuccess) {
                notification.classList.add('success');
                notification.classList.remove('error');
                notification.innerHTML = '✓ ' + message;
            } else {
                notification.classList.add('error');
                notification.classList.remove('success');
                notification.innerHTML = '⚠ ' + message;
            }
            
            notification.classList.add('show');
            
            notifTimeout = setTimeout(() => {
                hideNotification();
            }, 3500);
        }

        function hideNotification() {
            notification.classList.remove('show');
        }

        // Initialize users mock database from LocalStorage
        function getUsers() {
            const users = localStorage.getItem('chessTourUsers');
            return users ? JSON.parse(users) : {};
        }

        function saveUsers(users) {
            localStorage.setItem('chessTourUsers', JSON.stringify(users));
        }

        // Registration Logic
        registerForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value;

            if (!username || !password) {
                showNotification('Please fill all fields');
                return;
            }

            const users = getUsers();

            // Check if username is already registered as per requirements
            if (users[username]) {
                showNotification('This username already exists');
            } else {
                users[username] = { password: password };
                saveUsers(users);
                saveLastUser(username);
                showNotification('Registration successful! Please login.', true);
                
                // Automatically switch to login form and pre-fill the username
                setTimeout(() => {
                    toggleForm();
                    document.getElementById('loginUsername').value = username;
                    updateGreeting();
                }, 1500);
            }
        });

        // Login Logic
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;

            if (!username || !password) {
                showNotification('Please fill all fields');
                return;
            }

            const users = getUsers();

            // Validate credentials — give specific feedback per case
            if (!users[username]) {
                // Username doesn't exist at all
                showNotification(`Account "${username}" not found. Please register first.`);
                // Delay then flip to Register view, pre-filling the username
                setTimeout(() => {
                    toggleForm();
                    document.getElementById('regUsername').value = username;
                }, 2000);
            } else if (users[username].password !== password) {
                // Account exists but wrong password
                showNotification('Wrong password. Please try again.');
            } else {
                // Correct credentials
                showNotification('Login successful!', true);
                localStorage.setItem('currentUser', username);
                saveLastUser(username);
                updateGreeting();
                setTimeout(() => {
                    window.location.href = 'main.html';
                }, 1200);
            }
        });

        // Update greeting as soon as the page loads
        updateGreeting();
    </script>
</body>
</html>
