<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chess Tour - Play Match</title>
  
  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="style.css">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Chessboard CSS via Local -->
  <link rel="stylesheet" href="chessboard.css">

  <style>
    /* Play Interface specific styles */
    .play-layout {
      max-width: 1300px;
      margin: 30px auto;
      padding: 0 5%;
      display: grid;
      grid-template-areas: 
        "header header header"
        "left center right";
      grid-template-columns: 280px 1fr 280px;
      gap: 30px;
      align-items: center;
    }
    
    .play-header {
      grid-area: header;
      background: var(--glass-bg);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 15px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .time-keeper {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    
    .time-keeper .label {
      font-size: 14px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 5px;
    }

    .time-values {
      font-size: 32px;
      font-weight: 800;
      color: var(--text-light);
      display: flex;
      gap: 15px;
      align-items: center;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
    }
    
    .timer-w { color: #f0d9b5; }
    .timer-b { color: #b58863; }

    .game-controls {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .theme-modal {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: var(--bg-dark);
      border: 1px solid var(--glass-border);
      padding: 20px;
      border-radius: 15px;
      z-index: 1000;
      width: 320px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
    }

    .theme-modal.active { display: block; }

    .theme-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      max-height: 200px;
      overflow-y: auto;
      margin-bottom: 20px;
    }

    .theme-option {
      cursor: pointer;
      border: 2px solid transparent;
      border-radius: 8px;
      padding: 5px;
      text-align: center;
      transition: all 0.3s;
    }

    .theme-option:hover { background: rgba(255,255,255,0.1); }
    .theme-option.active { border-color: var(--primary); background: rgba(0,210,255,0.1); }
    .theme-option img { width: 100%; border-radius: 5px; }
    .theme-option span { font-size: 10px; display: block; margin-top: 4px; }

    .btn-theme {
      background: rgba(247, 147, 26, 0.2);
      color: #f7931a;
      border: 1px solid rgba(247, 147, 26, 0.4);
    }
    
    .btn-theme:hover {
      background: rgba(247, 147, 26, 0.3);
      border-color: #f7931a;
    }

    .score-keeper {
      display: flex;
      flex-direction: column;
      gap: 5px;
      font-size: 18px;
      font-weight: 600;
      min-width: 150px;
    }
    
    #opponentScoreBox { text-align: left; }
    #playerScoreBox { text-align: right; }

    .score-value {
      font-size: 28px;
      color: var(--primary);
    }

    .board-container {
      grid-area: center;
      display: flex;
      justify-content: center;
      position: relative;
    }

    #myBoard {
      width: 100%;
      max-width: 650px;
      border-radius: 8px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6), 0 0 20px rgba(0, 210, 255, 0.1);
      border: 6px solid var(--bg-dark);
      overflow: hidden;
    }

    .profile-card {
      background: var(--glass-bg);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 40px 20px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
      position: relative;
    }

    .profile-left { grid-area: left; }
    .profile-right { grid-area: right; }

    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      margin: 0 auto 20px;
      background: linear-gradient(135deg, rgba(0, 210, 255, 0.2), rgba(58, 123, 213, 0.2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 50px;
      border: 3px solid rgba(0, 210, 255, 0.5);
      box-shadow: inset 0 0 20px rgba(0, 210, 255, 0.2), 0 10px 20px rgba(0,0,0,0.3);
    }

    .profile-card h3 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(to right, #00d2ff, #3a7bd5);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .profile-card .elo {
      color: var(--text-light);
      font-weight: 500;
      font-size: 18px;
      background: rgba(0, 0, 0, 0.3);
      padding: 6px 15px;
      border-radius: 20px;
      display: inline-block;
      border: 1px solid var(--glass-border);
    }

    .captured-pieces {
      margin-top: 25px;
      min-height: 40px;
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      justify-content: center;
      align-items: center;
      color: var(--text-muted);
      font-size: 20px;
    }
    
    .captured-pieces i {
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }
    .cap-w { color: #f0d9b5; }
    .cap-b { color: #222; -webkit-text-stroke: 1px #888; }

    /* Modal Styles */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background: var(--bg-dark);
      border: 1px solid var(--primary);
      border-radius: 25px;
      padding: 50px 40px;
      text-align: center;
      max-width: 450px;
      width: 90%;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7), 0 0 30px rgba(0, 210, 255, 0.15);
      transform: translateY(50px) scale(0.9);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .modal-overlay.active .modal-content {
      transform: translateY(0) scale(1);
    }

    .modal-content h2 {
      font-size: 36px;
      margin-bottom: 15px;
      background: linear-gradient(to right, #00d2ff, #3a7bd5);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .modal-content p {
      color: var(--text-muted);
      margin-bottom: 35px;
      font-size: 18px;
      line-height: 1.5;
    }

    .modal-actions {
      display: flex;
      gap: 20px;
      justify-content: center;
    }

    /* Target specific chessboardjs styles for dark mode tweak */
    .white-1e1d7 { background-color: #f0d9b5; color: #b58863; }
    .black-3c85d { background-color: #b58863; color: #f0d9b5; }
    
    @media (max-width: 1100px) {
      .play-layout {
        grid-template-areas: 
          "header header"
          "left right"
          "center center";
        grid-template-columns: 1fr 1fr;
      }
      .board-container {
        margin-top: 20px;
      }
    }

    @media (max-width: 768px) {
      .play-layout {
        grid-template-areas: 
          "header"
          "left"
          "center"
          "right";
        grid-template-columns: 1fr;
      }
      .play-header {
        flex-direction: column;
        gap: 15px;
        text-align: center;
      }
      #opponentScoreBox, #playerScoreBox { text-align: center; }
    }
  </style>
</head>
<body>
  <!-- Decorative Background -->
  <div class="bg-pattern"></div>
  <div class="circle circle-1"></div>
  <div class="circle circle-2"></div>

  <!-- Navigation -->
  <nav class="navbar">
    <div class="nav-brand">
      <i class="fas fa-chess-knight"></i> Chess Tour
    </div>
    <div class="nav-user">
      <button class="btn-logout" onclick="quitMatch()">
        <i class="fas fa-sign-out-alt"></i> Forfeit & Quit
      </button>

  <!-- Play Layout -->
  <div class="play-layout">

    <div class="play-header">

        <span>Enemy Score</span>

    <!-- Opponent Profile (Left) -->

  </div>

  <!-- Game Over Modal -->
  <div class="modal-overlay" id="gameOverModal">
    <div class="modal-content">
      <h2 id="modalTitle">Checkmate!</h2>
      <p id="modalDesc">You won the match! Calculated base score + capture points.</p>
          <div class="game-controls">
            <button class="btn btn-primary" onclick="window.location.reload()"><i class="fas fa-redo"></i> New Game</button>
            <button class="btn btn-theme" onclick="openThemeModal()"><i class="fas fa-palette"></i> Change Theme</button>
            <button class="btn btn-danger" onclick="window.location.href='main.html'"><i class="fas fa-flag"></i> Resign</button>

  </div>

  <!-- Theme Modal -->
  <div class="theme-modal" id="themeModal">
    <h3 style="margin-bottom:15px; font-size:18px;">Select Theme</h3>
    <div class="theme-grid" id="themeSelectorGrid"></div>
    <button class="btn btn-primary" style="width:100%;" onclick="closeThemeModal()">Done</button>
  </div>

  <!-- Board.js Scripts -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="chessboard.js"></script>
  <script src="chess.js"></script>

  <!-- Chess Rules & Game Logic -->
  <script>
    // ───── Tier / Rank System ─────
    const TIERS = [
        { name: 'Unranked',      min: 0,    max: 300,  icon: '⬜' },
        { name: 'Beginner',      min: 300,  max: 1000, icon: '🔵' },
        { name: 'Elementary',    min: 1000, max: 1500, icon: '🟢' },
        { name: 'Bronze',        min: 1500, max: 2000, icon: '🥉' },
        { name: 'Silver',        min: 2000, max: 2500, icon: '🥈' },
        { name: 'Gold',          min: 2500, max: 3000, icon: '🥇' },
        { name: 'Platinum',      min: 3000, max: 3500, icon: '🪙' },
        { name: 'Diamond',       min: 3500, max: 4000, icon: '💎' },
        { name: 'Ace',           min: 4000, max: 4500, icon: '🌟' },
        { name: 'Conqueror',     min: 4500, max: 5000, icon: '👑' },
        { name: 'God of the Game', min: 5000, max: Infinity, icon: '🔱' },
    ];

    function getTier(pts) {
        for (let i = TIERS.length - 1; i >= 0; i--) {
            if (pts >= TIERS[i].min) return TIERS[i];
        }
        return TIERS[0];
    }

    let board = null;
    let game = new Chess();
    let whiteSquareGrey = '#a9a9a9';
    let blackSquareGrey = '#696969';
    let boardSkin = 'default';
    let pieceSkin = 'wikipedia';

    // Player rank points (loaded from localStorage)
    let userRankPoints = 0;
    let playerSide = 'w';
    
    // Scoring System
    // Pawn = 1, Knight = 3, Bishop = 3, Rook = 5, Queen = 9
    const pieceValues = { 'p': 1, 'n': 3, 'b': 3, 'r': 5, 'q': 9, 'k': 0 };
    
    // Font Awesome classes for pieces
    const iconMap = {
        'p': 'fas fa-chess-pawn',
        'n': 'fas fa-chess-knight',
        'b': 'fas fa-chess-bishop',
        'r': 'fas fa-chess-rook',
        'q': 'fas fa-chess-queen',
        'k': 'fas fa-chess-king'
    };

    let playerPoints = 0;
    let opponentPoints = 0;
    
    // Timer System
    let whiteTime = 600; // 10 minutes
    let blackTime = 600;
    let timerInterval = null;

    function removeGreySquares () {
      $('#myBoard .square-55d63').css('background', '');
    }

    function greySquare (square) {
      var $square = $('#myBoard .square-' + square)
      var background = whiteSquareGrey
      if ($square.hasClass('black-3c85d')) {
        background = blackSquareGrey
      }
      $square.css('background', background)
    }

    function onDragStart (source, piece, position, orientation) {
      if (game.game_over()) return false;

      // Only allow moves for the active side
      if ((game.turn() === 'w' && piece.search(/^b/) !== -1) ||
          (game.turn() === 'b' && piece.search(/^w/) !== -1)) {
        return false;
      }
      
      // Allow only the player to move during their turn (w)
      if (game.turn() !== playerSide) {
          return false; 
      }
    }

    function onDrop (source, target) {
      removeGreySquares();

      // Check legal move
      let move = game.move({
        from: source,
        to: target,
        promotion: 'q' // simplify promotion to Queen always
      });

      // Illegal move resets piece
      if (move === null) return 'snapback';
      
      handleMoveResult(move);
      
      // Bot triggers after a short delay
      if (!game.game_over()) {
          setTimeout(makeBotMove, 600);
      }
    }
    
    function makeBotMove() {
        if (game.game_over()) return;

        let possibleMoves = game.moves({ verbose: true });
        if (possibleMoves.length === 0) return;

        const tier = getTier(userRankPoints);
        const tierIdx = TIERS.findIndex(t => t.name === tier.name);
        // tierIdx 0=Unranked ... 10=God of the Game

        let moveObj;

        if (tierIdx === 0) {
            // Unranked: fully random
            moveObj = possibleMoves[Math.floor(Math.random() * possibleMoves.length)];

        } else if (tierIdx === 1) {
            // Beginner: 30% chance to take a capture
            const caps = possibleMoves.filter(m => m.captured);
            if (caps.length > 0 && Math.random() > 0.7) {
                moveObj = caps[Math.floor(Math.random() * caps.length)];
            } else {
                moveObj = possibleMoves[Math.floor(Math.random() * possibleMoves.length)];
            }

        } else if (tierIdx === 2) {
            // Elementary: always take best capture if available (60%), else random
            const caps = possibleMoves.filter(m => m.captured);
            if (caps.length > 0 && Math.random() > 0.4) {
                caps.sort((a, b) => pieceValues[b.captured] - pieceValues[a.captured]);
                moveObj = caps[0];
            } else {
                moveObj = possibleMoves[Math.floor(Math.random() * possibleMoves.length)];
            }

        } else if (tierIdx === 3) {
            // Bronze: always best capture (80%), else prefer center
            const caps = possibleMoves.filter(m => m.captured);
            if (caps.length > 0 && Math.random() > 0.2) {
                caps.sort((a, b) => pieceValues[b.captured] - pieceValues[a.captured]);
                moveObj = caps[0];
            } else {
                const center = ['d4','d5','e4','e5'];
                const centerMoves = possibleMoves.filter(m => center.includes(m.to));
                moveObj = centerMoves.length > 0 ? centerMoves[0] : possibleMoves[Math.floor(Math.random() * possibleMoves.length)];
            }

        } else if (tierIdx <= 5) {
            // Silver / Gold: best capture always + simple positional score
            const caps = possibleMoves.filter(m => m.captured);
            if (caps.length > 0) {
                caps.sort((a, b) => pieceValues[b.captured] - pieceValues[a.captured]);
                moveObj = caps[0];
            } else {
                // Score moves by piece development + center control
                moveObj = scoredRandomMove(possibleMoves, 0.5);
            }

        } else if (tierIdx <= 7) {
            // Platinum / Diamond: greedy best capture + avoid hanging pieces
            const safeMoves = possibleMoves.filter(m => !isHanging(m));
            const moveset = safeMoves.length > 0 ? safeMoves : possibleMoves;
            const caps = moveset.filter(m => m.captured);
            if (caps.length > 0) {
                caps.sort((a, b) => pieceValues[b.captured] - pieceValues[a.captured]);
                moveObj = caps[0];
            } else {
                moveObj = scoredRandomMove(moveset, 0.8);
            }

        } else {
            // Ace / Conqueror / God: near-optimal — best capture, never hangs pieces, prefers checks
            const safeMoves = possibleMoves.filter(m => !isHanging(m));
            const moveset = safeMoves.length > 0 ? safeMoves : possibleMoves;
            const checkMoves = moveset.filter(m => { const r = game.move(m); const inChk = game.in_check(); game.undo(); return r && inChk; });
            const caps = moveset.filter(m => m.captured);
            if (caps.length > 0) {
                caps.sort((a, b) => pieceValues[b.captured] - pieceValues[a.captured]);
                moveObj = caps[0];
            } else if (checkMoves.length > 0) {
                moveObj = checkMoves[0];
            } else {
                moveObj = scoredRandomMove(moveset, 1.0);
            }
        }

        let move = game.move(moveObj);
        board.position(game.fen());
        handleMoveResult(move);
    }

    // Give moves a positional score and pick one weighted by score
    function scoredRandomMove(moves, weight) {
        if (moves.length === 0) return null;
        const center = { d4:2, d5:2, e4:2, e5:2, c3:1, f3:1, c6:1, f6:1 };
        const scored = moves.map(m => ({ m, s: (center[m.to] || 0) * weight }));
        const total = scored.reduce((s, x) => s + x.s + 0.1, 0);
        let r = Math.random() * total;
        for (const { m, s } of scored) {
            r -= s + 0.1;
            if (r <= 0) return m;
        }
        return moves[0];
    }

    // Rough check: would moving there leave the piece attacked?
    function isHanging(moveObj) {
        const result = game.move(moveObj);
        if (!result) return false;
        const attacked = game.moves({ verbose: true }).some(m => m.to === moveObj.to);
        game.undo();
        return attacked;
    }
    
    function formatIcon(piece, color) {
        let cls = iconMap[piece];
        let colCls = color === 'w' ? 'cap-w' : 'cap-b';
        return `<i class="${cls} ${colCls}"></i>`;
    }

    function handleMoveResult(move) {
        // Did anyone capture a piece?
        if (move.captured) {
            let pts = pieceValues[move.captured] || 0;
            // The mover claims the captured item point
            let capturedColor = move.color === 'w' ? 'b' : 'w';
            let iconHtml = formatIcon(move.captured, capturedColor);

            if (move.color === playerSide) {
                playerPoints += pts;
                $('#playerScore').text(playerPoints);
                document.getElementById('playerCaptures').innerHTML += iconHtml;
            } else {
                opponentPoints += pts;
                $('#opponentScore').text(opponentPoints);
                document.getElementById('opponentCaptures').innerHTML += iconHtml;
            }
        }
        updateStatus();
    }

    function onMouseoverSquare (square, piece) {
      if (game.turn() !== playerSide || game.game_over()) return;
      var moves = game.moves({ square: square, verbose: true });
      if (moves.length === 0) return;

      greySquare(square);
      for (var i = 0; i < moves.length; i++) {
        greySquare(moves[i].to);
      }
    }

    function onMouseoutSquare (square, piece) {
      removeGreySquares();
    }

    function onSnapEnd () {
      board.position(game.fen());
    }

    function formatTime(seconds) {
        let m = Math.floor(seconds / 60);
        let s = seconds % 60;
        return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
    }

    function startTimer() {
        if(timerInterval) clearInterval(timerInterval);
        
        // Update initially
        $('#timerWhite').text(formatTime(whiteTime));
        $('#timerBlack').text(formatTime(blackTime));

        timerInterval = setInterval(() => {
            if (game.game_over()) {
                clearInterval(timerInterval);
                return;
            }
            if (game.turn() === 'w') {
                whiteTime--;
                $('#timerWhite').text(formatTime(whiteTime));
                if (whiteTime <= 0) endGame("Time's Up!", "black");
            } else {
                blackTime--;
                $('#timerBlack').text(formatTime(blackTime));
                if (blackTime <= 0) endGame("Time's Up!", "white");
            }
        }, 1000);
    }

    function updateStatus () {
      if (game.in_checkmate()) {
        let winner = game.turn() === 'w' ? 'black' : 'white';
        endGame("Checkmate!", winner);
      }
      else if (game.in_draw() || game.in_stalemate() || game.in_threefold_repetition()) {
        endGame("Draw!", "draw");
      }
    }
    
    // ───── Point & ETH based endgame resolution ─────
    function endGame(reason, result) {
        clearInterval(timerInterval);

        let won = false;
        const isDraw = (result === 'draw');
        if (!isDraw && result === 'white' && playerSide === 'w') won = true;
        if (!isDraw && result === 'black' && playerSide === 'b') won = true;

        let pointsGained = 0;
        let ethGained = 0;
        let finalTitle = '';
        let finalDesc = '';
        let bonusMsg = '';

        if (isDraw) {
            pointsGained = 0;
            finalTitle = 'Draw!';
            finalDesc = 'Match ended in a draw. No points awarded.';
        } else if (won) {
            pointsGained = 100;
            ethGained += 0.5; // Win Reward
            finalTitle = 'Victory! 🎉';
            finalDesc = `You won! +100 Points and +0.5 ETH added.`;
        } else {
            pointsGained = 0;
            finalTitle = 'Defeat 😞';
            finalDesc = 'You lost. No points deducted — keep practicing!';
        }

        // Check for Rank Up bonus
        const oldTier = getTier(userRankPoints);
        userRankPoints += pointsGained;
        const newTier = getTier(userRankPoints);

        if (newTier.name !== oldTier.name && userRankPoints > oldTier.min) {
            ethGained += 1.5; // Rank Up Reward
            bonusMsg = `<br><span style="color:#f7931a; font-weight:bold;">Rank Up Bonus! +1.5 ETH</span>`;
        }

        // Save progress
        localStorage.setItem('userPoints', userRankPoints);
        let currentEth = parseFloat(localStorage.getItem('userEth') || '0');
        localStorage.setItem('userEth', (currentEth + ethGained).toString());

        // Show updated rank
        const tierMsg = pointsGained > 0 ? `<br>Rank: ${newTier.icon} ${newTier.name} (${userRankPoints} pts)` : '';
        const ethMsg = ethGained > 0 ? `<br><i class="fa-brands fa-ethereum"></i> Total Gained: ${ethGained.toFixed(1)} ETH` : '';
        
        $('#playerElo').text(`${userRankPoints} pts`);

        $('#modalTitle').text(finalTitle);
        $('#modalDesc').html(finalDesc + tierMsg + ethMsg + bonusMsg);
        $('#gameOverModal').addClass('active');
    }

    function quitMatch() {
        if (confirm('Are you sure you want to forfeit? (No points will be awarded)')) {
            endGame('Forfeit', playerSide === 'w' ? 'black' : 'white');
        }
    }

    function rematch() {
        $('#gameOverModal').removeClass('active');
        game.reset();
        board.start();
        whiteTime = 600;
        blackTime = 600;
        playerPoints = 0;
        opponentPoints = 0;
        $('#playerScore').text('0');
        $('#opponentScore').text('0');
        $('#playerCaptures').html('');
        $('#opponentCaptures').html('');
        updateStatus();
    }

    // ───── Theme Selection Logic ─────
    function openThemeModal() {
        renderThemeSelector();
        document.getElementById('themeModal').classList.add('active');
    }

    function closeThemeModal() {
        document.getElementById('themeModal').classList.remove('active');
    }

    function renderThemeSelector() {
        const grid = document.getElementById('themeSelectorGrid');
        const owned = JSON.parse(localStorage.getItem('ownedSkins') || '["default", "wikipedia"]');
        const currBoard = localStorage.getItem('equippedBoard') || 'default';
        const currPieces = localStorage.getItem('equippedPieces') || 'wikipedia';

        // Predefined list of possible themes (matching SHOP_ITEMS)
        const allBoards = [
            {id:'default', name:'Wood'}, {id:'red', name:'Red'}, {id:'blue', name:'Blue'}, 
            {id:'green', name:'Green'}, {id:'marble', name:'Marble'}, {id:'ocean', name:'Ocean'},
            {id:'forest', name:'Forest'}, {id:'dark', name:'Dark'}, {id:'purple', name:'Purple'}
        ];
        const allPieces = [
            {id:'wikipedia', name:'Wiki'}, {id:'alpha', name:'Alpha'}, 
            {id:'cburnett', name:'CB'}, {id:'neo', name:'Neo'}
        ];

        grid.innerHTML = '<div style="grid-column: 1/-1; font-size:12px; margin-top:10px; opacity:0.7">Boards</div>';
        allBoards.forEach(b => {
            if (owned.includes(b.id)) {
                grid.innerHTML += `<div class="theme-option ${currBoard === b.id ? 'active' : ''}" onclick="changeTheme('boards', '${b.id}')">
                    <div style="width:30px; height:30px; margin:0 auto; background:var(--primary); border-radius:4px;" class="board-${b.id}"></div>
                    <span>${b.name}</span>
                </div>`;
            }
        });

        grid.innerHTML += '<div style="grid-column: 1/-1; font-size:12px; margin-top:15px; opacity:0.7">Pieces</div>';
        allPieces.forEach(p => {
            if (owned.includes(p.id)) {
                grid.innerHTML += `<div class="theme-option ${currPieces === p.id ? 'active' : ''}" onclick="changeTheme('pieces', '${p.id}')">
                    <img src="https://chessboardjs.com/img/chesspieces/wikipedia/wN.png" style="width:25px; ${p.id !== 'wikipedia' ? 'filter:hue-rotate(150deg)' : ''}">
                    <span>${p.name}</span>
                </div>`;
            }
        });
    }

    function changeTheme(category, id) {
        if (category === 'boards') {
            localStorage.setItem('equippedBoard', id);
            // Apply instantly
            const boardEl = document.getElementById('myBoard');
            boardEl.className = '';
            boardEl.classList.add('board-container', 'board-' + id);
        } else {
            localStorage.setItem('equippedPieces', id);
            // Pieces need a board refresh
            pieceSkin = id;
            const currentPosition = board.position();
            const orientation = board.orientation();
            board.destroy();
            board = Chessboard('myBoard', {
                draggable: true,
                position: currentPosition,
                orientation: orientation,
                pieceTheme: `https://chessboardjs.com/img/chesspieces/${pieceSkin}/{piece}.png`,
                onDragStart: onDragStart,
                onDrop: onDrop,
                onSnapEnd: onSnapEnd
            });
        }
        renderThemeSelector();
    }

    function initializeSystem() {
        // Load player name
        const storedUser = localStorage.getItem('currentUser') || 'Guest Player';
        $('#playerName').text(storedUser);

        // Load rank points (new system: userPoints)
        const storedPts = localStorage.getItem('userPoints');
        userRankPoints = storedPts !== null ? parseInt(storedPts) : 0;
        const tier = getTier(userRankPoints);
        $('#playerElo').text(`${userRankPoints} pts`);

        // Show opponent difficulty label based on tier
        const tierIdx = TIERS.findIndex(t => t.name === tier.name);
        const opponentNames = [
            'Random Bot', 'Casual Bot', 'Club Bot', 'Amateur Bot',
            'Skilled Bot', 'Expert Bot', 'Master Bot', 'Grandmaster Bot',
            'Elite Bot', 'Champion Bot', 'Mythic Bot'
        ];
        const opponentEloLabels = [
            '~400', '~600', '~900', '~1100',
            '~1300', '~1500', '~1700', '~1900',
            '~2100', '~2300', '~2500+'
        ];
        $('#opponentName').text(opponentNames[tierIdx] || 'Grandmaster Bot');
        $('#opponentElo').text(opponentEloLabels[tierIdx] || '2000');

        // Apply Customization (Board & Pieces)
        boardSkin = localStorage.getItem('equippedBoard') || 'default';
        pieceSkin = localStorage.getItem('equippedPieces') || 'wikipedia';
        
        // Add class to container for board colors
        $('#myBoard').removeClass().addClass('board-container board-' + boardSkin);

        // Instantiate Board
        var config = {
            draggable: true,
            position: 'start',
            onDragStart: onDragStart,
            onDrop: onDrop,
            onMouseoutSquare: onMouseoutSquare,
            onMouseoverSquare: onMouseoverSquare,
            onSnapEnd: onSnapEnd,
            pieceTheme: `https://chessboardjs.com/img/chesspieces/${pieceSkin}/{piece}.png`
        };
        board = Chessboard('myBoard', config);

        $(window).resize(board.resize);
        startTimer();
    }

    // Fire setup when DOM is ready
    $(document).ready(initializeSystem);

  </script>
</body>
</html>
